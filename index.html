<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ditto Clean Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d1117; font-family: 'DotGothic16', sans-serif; color: #e6edf3; }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        .neon-border { border: 2px solid #00f2ff; box-shadow: 0 0 10px #00f2ff; }
        .quest-card { background: linear-gradient(145deg, #161b22, #0d1117); transition: transform 0.2s; }
        .quest-card:active { transform: scale(0.95); }
        .exp-bar-bg { height: 12px; background: #21262d; border-radius: 6px; overflow: hidden; }
        .exp-bar-fill { height: 100%; background: linear-gradient(90deg, #00f2ff, #0066ff); transition: width 0.5s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .staff-btn { background: #161b22; border: 1px solid #30363d; transition: all 0.2s; }
        .staff-btn:hover { border-color: #00f2ff; color: #00f2ff; box-shadow: 0 0 8px #00f2ff; }
        /* 読み込み完了まで非表示にする設定 */
        [v-cloak] { display: none; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <div id="app" v-cloak>
        <!-- プレイヤー選択 -->
        <div v-if="!isLogined" class="min-h-screen flex flex-col justify-center items-center space-y-8">
            <h1 class="text-2xl text-cyan-400 pixel-font animate-pulse">SELECT PLAYER</h1>
            <div class="grid grid-cols-2 gap-4 w-full px-4">
                <button v-for="staff in staffList" :key="staff.name" @click="login(staff)" 
                        class="staff-btn py-4 rounded-lg font-bold">
                    <div>{{ staff.name }}</div>
                    <div class="text-[10px] text-gray-400 font-normal mt-1">Lv.{{ staff.level }}</div>
                </button>
            </div>
            <p v-if="staffList.length === 0" class="text-gray-500 text-sm">LOADING PLAYER LIST...</p>
        </div>

        <div v-else>
            <!-- タブ -->
            <div class="flex justify-around mb-6 bg-gray-900 rounded-lg p-1 border border-gray-700">
                <button @click="currentView = 'tasks'" 
                        :class="['flex-1 py-2 text-sm', currentView === 'tasks' ? 'text-cyan-400 font-bold bg-gray-800 rounded' : 'text-gray-400']">
                    🛠 任務一覧
                </button>
                <button @click="showRanking" 
                        :class="['flex-1 py-2 text-sm', currentView === 'ranking' ? 'text-cyan-400 font-bold bg-gray-800 rounded' : 'text-gray-400']">
                    🏆 順位表
                </button>
            </div>

            <!-- タスク一覧 -->
            <div v-show="currentView === 'tasks'">
                <header class="neon-border rounded-xl p-4 mb-6 bg-black">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] text-gray-400">PLAYER: {{ staffName }}</span>
                        <button @click="logout" class="text-[10px] text-gray-500 underline">CHANGE</button>
                    </div>
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-xs text-cyan-400 pixel-font">LEVEL</p>
                            <p class="text-3xl font-bold text-white pixel-font">{{ user.level }}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-yellow-400">NEXT: {{ 100 - (user.points % 100) }}%</p>
                            <p class="text-xl text-white font-bold">{{ user.points }} <span class="text-xs">PT</span></p>
                        </div>
                    </div>
                    <div class="exp-bar-bg">
                        <div class="exp-bar-fill" :style="{ width: (user.points % 100) + '%' }"></div>
                    </div>
                </header>

                <div class="flex overflow-x-auto space-x-2 mb-6 no-scrollbar">
                    <button v-for="cat in categories" @click="currentCategory = cat" 
                        :class="currentCategory === cat ? 'bg-cyan-600 border-cyan-400' : 'bg-gray-800 border-gray-600'"
                        class="px-4 py-1 rounded-full border text-xs whitespace-nowrap">
                        {{ cat }}
                    </button>
                </div>

                <div class="space-y-3">
                    <div v-for="task in filteredTasks" :key="task.name" class="quest-card border border-gray-700 rounded-lg p-4 flex justify-between items-center">
                        <div class="flex-1">
                            <h3 class="text-sm font-bold mb-1">{{ task.name }}</h3>
                            <div class="text-xs text-gray-400">{{ task.level }} / {{ task.point }} PT</div>
                        </div>
                        <button @click="completeTask(task)" 
                                class="border border-cyan-500 text-cyan-400 px-3 py-1 rounded text-xs hover:bg-cyan-500 hover:text-white transition-colors">
                            CLEAR
                        </button>
                    </div>
                </div>
            </div>

            <!-- ランキング -->
            <div v-show="currentView === 'ranking'">
                <h2 class="text-cyan-400 text-lg pixel-font mb-4 text-center">🏆 RANKING</h2>
                <div v-if="loadingRanking" class="text-center py-10">集計中...</div>
                <div v-else class="bg-gray-900 rounded-lg border border-gray-700">
                    <table class="w-full text-sm">
                        <tr v-for="(staff, index) in sortedRanking" :key="staff.name" class="border-b border-gray-800">
                            <td class="p-3 text-yellow-500 font-bold">{{ index + 1 }}位</td>
                            <td class="p-3">{{ staff.name }}</td>
                            <td class="p-3 text-right font-bold text-cyan-400">{{ staff.totalPoints }} PT</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return { 
                    gasUrl: 'https://script.google.com/macros/s/AKfycbxAzQcIz5JsJS7AlPLlRlIms3gr1bDjnY7dBJhzpuL0k8mbDVfncgVSNnM7cocqBIa5/exec',
                    staffList: JSON.parse(localStorage.getItem('cache_staff') || '[]'),
                    tasks: JSON.parse(localStorage.getItem('cache_tasks') || '[]'),
                    staffName: localStorage.getItem('selected_staff') || '',
                    isLogined: !!localStorage.getItem('selected_staff'),
                    categories: [],
                    currentCategory: '',
                    currentView: 'tasks',
                    rankingData: [],
                    loadingRanking: false,
                    user: { level: 1, points: 0 }
                }
            },
            computed: {
                filteredTasks() {
                    return this.tasks.filter(t => t.category === this.currentCategory);
                },
                sortedRanking() {
                    return [...this.rankingData].sort((a, b) => b.totalPoints - a.totalPoints);
                }
            },
            mounted() {
                this.initApp();
                this.fetchData(); // 裏で最新版を取得
            },
            methods: {
                initApp() {
                    if (this.tasks.length > 0) {
                        this.categories = [...new Set(this.tasks.map(t => t.category))];
                        this.currentCategory = this.categories[0];
                    }
                    if (this.isLogined) this.updateUserInfo();
                },
                async fetchData() {
                    try {
                        const response = await fetch(this.gasUrl);
                        const data = await response.json();
                        this.tasks = data.tasks;
                        this.staffList = data.staffList;
                        // キャッシュ更新
                        localStorage.setItem('cache_tasks', JSON.stringify(data.tasks));
                        localStorage.setItem('cache_staff', JSON.stringify(data.staffList));
                        this.initApp();
                    } catch (e) { console.error("Data fetch failed", e); }
                },
                login(staff) {
                    this.staffName = staff.name;
                    localStorage.setItem('selected_staff', staff.name);
                    this.isLogined = true;
                    this.updateUserInfo();
                },
                logout() {
                    localStorage.removeItem('selected_staff');
                    this.isLogined = false;
                    this.staffName = '';
                },
                updateUserInfo() {
                    const info = this.staffList.find(s => s.name === this.staffName);
                    if (info) {
                        this.user.points = info.points;
                        this.user.level = info.level;
                    }
                },
                async completeTask(task) {
                    if (!confirm(`${task.name} クリア！`)) return;

                    // 1. 画面上の数字を即座に増やす（待ち時間ゼロ）
                    this.user.points += task.point;
                    this.user.level = Math.floor(this.user.points / 100) + 1;

                    // 2. 裏でGASに送信（結果を待たずに次に進める）
                    fetch(this.gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            staffName: this.staffName,
                            taskName: task.name,
                            category: task.category,
                            point: task.point
                        })
                    }).catch(e => console.error("Post failed", e));
                },
                async showRanking() {
                    this.currentView = 'ranking';
                    this.loadingRanking = true;
                    try {
                        const response = await fetch(`${this.gasUrl}?action=getRanking`);
                        this.rankingData = await response.json();
                    } catch (e) { console.error(e); }
                    this.loadingRanking = false;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
