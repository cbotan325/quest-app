<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ditto Clean Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d1117; font-family: 'DotGothic16', sans-serif; color: #e6edf3; }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        .neon-border { border: 2px solid #00f2ff; box-shadow: 0 0 10px #00f2ff; }
        .quest-card { background: linear-gradient(145deg, #161b22, #0d1117); transition: transform 0.2s; }
        .quest-card:active { transform: scale(0.95); }
        .exp-bar-bg { height: 12px; background: #21262d; border-radius: 6px; overflow: hidden; }
        .exp-bar-fill { height: 100%; background: linear-gradient(90deg, #00f2ff, #0066ff); transition: width 0.5s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* スタッフ選択用のボタンスタイル */
        .staff-btn { background: #161b22; border: 1px solid #30363d; transition: all 0.2s; }
        .staff-btn:hover { border-color: #00f2ff; color: #00f2ff; box-shadow: 0 0 8px #00f2ff; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <div id="app">
        <div v-if="!isLogined" class="min-h-screen flex flex-col justify-center items-center space-y-8">
            <h1 class="text-2xl text-cyan-400 pixel-font animate-pulse">SELECT PLAYER</h1>
            <div class="grid grid-cols-2 gap-4 w-full px-4">
                <button v-for="name in staffList" :key="name" @click="login(name)" 
                        class="staff-btn py-4 rounded-lg font-bold text-lg">
                    {{ name }}
                </button>
            </div>
            <p v-if="staffList.length === 0" class="text-gray-500">名簿を読み込み中...</p>
        </div>

        <template>
  <div class="ranking-container">
    <h2>🏆 貢献度ランキング</h2>
    <div v-if="loading">集計中...</div>
    <ul v-else class="ranking-list">
      <li v-for="(staff, index) in sortedRanking" :key="staff.name" class="ranking-item">
        <span class="rank">{{ index + 1 }}位</span>
        <span class="name">{{ staff.name }}</span>
        <span class="points">{{ staff.totalPoints }} pt</span>
      </li>
    </ul>
  </div>
</template>

<script setup>
import { ref, onMounted, computed } from 'vue';

const rankingData = ref([]);
const loading = ref(true);
const GAS_URL = "https://script.google.com/macros/s/AKfycbxAzQcIz5JsJS7AlPLlRlIms3gr1bDjnY7dBJhzpuL0k8mbDVfncgVSNnM7cocqBIa5/exec"; //

const fetchRanking = async () => {
  try {
    const response = await fetch(`${GAS_URL}?action=getRanking`);
    rankingData.value = await response.json();
  } catch (error) {
    console.error("ランキング取得失敗:", error);
  } finally {
    loading.value = false;
  }
};

// ポイント順にソート
const sortedRanking = computed(() => {
  return [...rankingData.value].sort((a, b) => b.totalPoints - a.totalPoints);
});

onMounted(fetchRanking);
</script>

<style scoped>
.ranking-list { list-style: none; padding: 0; }
.ranking-item {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #eee;
}
.rank { font-weight: bold; width: 40px; }
.points { color: #f39c12; font-weight: bold; }
</style>

        <div v-else>
            <header class="neon-border rounded-xl p-4 mb-6 bg-black">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-gray-400">PLAYER: {{ staffName }}</span>
                    <button @click="logout" class="text-[10px] text-gray-500 underline">CHANGE</button>
                </div>
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <p class="text-xs text-cyan-400 pixel-font">LEVEL</p>
                        <p class="text-3xl font-bold text-white pixel-font">{{ user.level }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-yellow-400">NEXT: {{ 100 - user.exp }}%</p>
                        <p class="text-xl text-white font-bold">{{ user.points }} <span class="text-xs">PT</span></p>
                    </div>
                </div>
                <div class="exp-bar-bg">
                    <div class="exp-bar-fill" :style="{ width: user.exp + '%' }"></div>
                </div>
                <p class="text-center text-xs mt-2 text-cyan-300">称号：{{ user.title }}</p>
            </header>

            <div class="flex overflow-x-auto space-x-2 mb-6 no-scrollbar">
                <button v-for="cat in categories" @click="currentCategory = cat" 
                    :class="currentCategory === cat ? 'bg-cyan-600 border-cyan-400' : 'bg-gray-800 border-gray-600'"
                    class="px-4 py-1 rounded-full border text-xs whitespace-nowrap transition-colors">
                    {{ cat }}
                </button>
            </div>

            <h2 class="text-cyan-400 text-sm mb-4 flex items-center">
                <span class="mr-2">▶</span> ACTIVE QUESTS ({{ currentCategory }})
            </h2>
            
            <div class="space-y-3">
                <div v-for="task in filteredTasks" :key="task.name" class="quest-card border border-gray-700 rounded-lg p-4 flex justify-between items-center">
                    <div class="flex-1">
                        <h3 class="text-sm font-bold mb-1">{{ task.name }}</h3>
                        <div class="flex items-center space-x-2">
                            <span class="text-yellow-500 text-xs">{{ task.level }}</span>
                            <span class="text-gray-500 text-[10px]">報酬: {{ task.point }} PT</span>
                        </div>
                    </div>
                    <button @click="completeTask(task)" class="ml-4 bg-transparent border border-cyan-500 text-cyan-400 px-3 py-1 rounded text-xs hover:bg-cyan-500 hover:text-white transition-all">
                        CLEAR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    gasUrl: 'https://script.google.com/macros/s/AKfycbxAzQcIz5JsJS7AlPLlRlIms3gr1bDjnY7dBJhzpuL0k8mbDVfncgVSNnM7cocqBIa5/exec', // ★ここにあなたのGASのURLを貼ってください
                    staffList: [],
                    staffName: localStorage.getItem('selected_staff') || '',
                    isLogined: !!localStorage.getItem('selected_staff'),
                    tasks: [],
                    categories: [],
                    currentCategory: '',
                    user: {
                        level: 1,
                        exp: 0,
                        points: 0,
                        title: '見習い清掃員'
                    }
                }
            },
            mounted() {
                this.fetchData();
            },
            methods: {
                async fetchData() {
                    try {
                        const response = await fetch(this.gasUrl);
                        const data = await response.json();
                        
                        this.tasks = data.tasks;
                        this.staffList = data.staffList;
                        
                        // カテゴリ一覧を抽出
                        if (this.tasks.length > 0) {
                            this.categories = [...new Set(this.tasks.map(t => t.category))];
                            this.currentCategory = this.categories[0];
                        }
                    } catch (e) {
                        console.error("データ取得失敗:", e);
                    }
                },
                login(name) {
                    this.staffName = name;
                    this.isLogined = true;
                    localStorage.setItem('selected_staff', name);
                },
                logout() {
                    if(confirm("プレイヤーを変更しますか？")) {
                        this.isLogined = false;
                        this.staffName = '';
                        localStorage.removeItem('selected_staff');
                    }
                },
                async completeTask(task) {
                    // 演出（簡易）
                    this.user.points += task.point;
                    this.user.exp += 20; // 経験値の上昇量は仮
                    
                    // GASに報告を送信
                    await fetch(this.gasUrl, {
                        method: "POST",
                        mode: "no-cors", // GASへのPOSTでエラーが出るのを防ぐ
                        body: JSON.stringify({
                            staffName: this.staffName,
                            category: task.category,
                            taskName: task.name,
                            point: task.point
                        })
                    });

                    if(this.user.exp >= 100) {
                        this.user.level++;
                        this.user.exp = 0;
                        alert("LEVEL UP!!");
                    }
                }
            },
            computed: {
                filteredTasks() {
                    return this.tasks.filter(t => t.category === this.currentCategory);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
