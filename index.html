<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Out Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff9800; --bg: #1a1a2e; --card: #16213e; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; width: 100%; max-width: 350px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #333; position: relative; }
        select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; background: #fff; }
        .status-display { font-size: 24px; font-weight: bold; color: var(--primary); text-align: center; margin: 10px 0; min-height: 30px; }
        .quest-item { margin: 15px 0; display: flex; align-items: center; font-size: 18px; }
        input[type="checkbox"] { width: 25px; height: 25px; margin-right: 15px; }
        button { background: linear-gradient(45deg, #ff9800, #f44336); color: white; border: none; padding: 15px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-check { background: #4a90e2; font-size: 14px; padding: 10px; margin-top: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <h3>👤 冒険者を選択</h3>
        <select id="userName" onchange="resetStatus()">
            <option value="">名前を選択してください</option>
            <option value="坂東">坂東</option>
            <option value="三浦">三浦</option>
            <option value="山口">山口</option>
        </select>
        <div class="status-display" id="myLevel">--</div>
        <button class="btn-check" id="checkBtn" onclick="checkMyLevel()">現在のレベルを確認</button>
    </div>

    <div class="card">
        <h3>⚔️ 今日のミッション</h3>
        <label class="quest-item"><input type="checkbox" class="q-check"> 掃除をする</label>
        <label class="quest-item"><input type="checkbox" class="q-check"> レジ締めをする</label>
        <label class="quest-item"><input type="checkbox" class="q-check"> 鍵を閉める</label>
    </div>

    <button id="submitBtn" onclick="sendReport()">業務完了・報告！</button>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxa4m1A6YrHds49cLi39tlouSNUwBF-PbWM8mJQWG5GRKGlaVkfcwJvz6WU47byqc0b/exec"; 

        function resetStatus() {
            document.getElementById('myLevel').innerText = "--";
        }

        // レベルを確認する関数
        async function checkMyLevel() {
            const name = document.getElementById('userName').value;
            if (!name) { alert("名前を選んでください！"); return; }

            const btn = document.getElementById('checkBtn');
            btn.innerText = "確認中...";
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "checkLevel", name: name })
                });
                const result = await response.json();
                document.getElementById('myLevel').innerText = result.level;
            } catch (e) {
                alert("確認に失敗しました。");
            } finally {
                btn.innerText = "現在のレベルを確認";
                btn.disabled = false;
            }
        }

        // 報告を送信する関数
        async function sendReport() {
            const name = document.getElementById('userName').value;
            const checks = document.querySelectorAll('.q-check:checked');
            const count = checks.length;

            if (!name) { alert("名前を選んでください！"); return; }
            if (count === 0) { alert("ミッションを1つ以上選んでください！"); return; }

            const level = count >= 2 ? "Lv.2" : "Lv.1";

            const btn = document.getElementById('submitBtn');
            btn.innerText = "送信中...";
            btn.disabled = true;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "submit", name: name, count: count, level: level })
                });

                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                alert(name + "さん、報告完了！\n現在のランク: " + level);
                
                // 表示を更新
                document.getElementById('myLevel').innerText = level;
                // チェックを外す
                checks.forEach(c => c.checked = false);
            } catch (e) {
                alert("送信に失敗しました。");
            } finally {
                btn.innerText = "業務完了・報告！";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
